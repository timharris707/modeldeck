name: pr-review-settled

# Merge gate: waits until CodeRabbit has reviewed the current head commit and
# every review thread is resolved, so merges can't race the bot's incremental
# pass (the PR #494-era gap, now enforced in CI instead of protocol). Reusable
# gate lives in timharris707/skills.
#
# Two shapes tested on PR #544 and rejected by GitHub, do not re-add:
# a pull_request_review_thread trigger (workflow stops loading entirely), and
# contents: none (startup_failure: the called workflow declares contents: read
# and a caller cannot grant less). Thread resolution after a gate timeout
# therefore needs a manual re-run (gh run rerun <run-id>), as the gate's
# failure message says.
#
# Concurrency is deliberately absent (#546). cancel-in-progress left every
# superseded run as a check SUITE concluded cancelled on the head commit, and
# the merge ruleset evaluates every suite carrying the required check name,
# so a fully green PR read BLOCKED until each cancelled run was manually
# rerun. Queued concurrency (cancel-in-progress: false) is no fix either:
# GitHub keeps at most one running plus one pending run per group and cancels
# the displaced pending run, so three rapid triggers (CodeRabbit resolving
# threads seconds apart) still mint cancelled suites. With no concurrency
# block every trigger runs to completion: the gate polls live PR state, so a
# superseded run also concludes green once threads settle, and the job is
# seconds long, so one run per review-comment event is cheap. Tripwire for
# #546 — two gate triggers within a second must reach mergeStateStatus CLEAN
# with no manual reruns — holds by construction: nothing here can produce a
# cancelled conclusion anymore.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  review-settled:
    uses: timharris707/skills/.github/workflows/review-settled.yml@main
    with:
      # Mirrors .coderabbit.yaml's auto_review skips: PRs CodeRabbit is
      # configured not to review must not wedge the gate waiting for one.
      # Keep these two lists in sync (same pairing as the skills repo's
      # own caller).
      skip-title-regex: 'handoff:|progress-log'
      skip-label: skip-review
      # The gate mostly waits for CodeRabbit, so it runs on L.Box's gate
      # runners (scripts/box-gate-runners.sh) instead of paid GitHub minutes.
      # Back to GitHub: set repo variable MODELDECK_GATE_RUNNER to '"ubuntu-latest"'.
      runs-on: ${{ vars.MODELDECK_GATE_RUNNER || '["self-hosted","modeldeck-gate"]' }}
